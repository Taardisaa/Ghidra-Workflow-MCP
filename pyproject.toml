[project]
name = "ghidra-api-mcp"
version = "1.0.3"
description = "MCP server for Ghidra API workflow retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Taardisaa", email = "136665562@qq.com"},
]
keywords = ["mcp", "ghidra", "reverse-engineering", "api", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10.0",
    "chromadb>=0.5.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Taardisaa/Ghidra-Script-Helper"
Repository = "https://github.com/Taardisaa/Ghidra-Script-Helper"
"Bug Tracker" = "https://github.com/Taardisaa/Ghidra-Script-Helper/issues"

[project.scripts]
ghidra-api-mcp = "ghidra_api_mcp.server:run_server"
ghidra-api-mcp-admin = "ghidra_api_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_api_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
